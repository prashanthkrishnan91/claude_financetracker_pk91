name: Workflow Certification

on:
  pull_request:
    paths:
      - '.github/**'
      - '.claude/**'
      - 'docs/ai/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repo hygiene audit (workflow tier)
        run: python3 scripts/repo_hygiene/audit_repo_hygiene.py

      - name: v4.1 lightweight certification checks
        run: python3 scripts/workflow/certify_v4_1.py
